{% extends 'base.html' %}

{% block content %}
<div class="blog-detail">
    <h1>{{ blog.title }}</h1>
    <div class="blog-meta">
        <small>
            <i>Created: {{ blog.created_at|date:"F j, Y, g:i a" }}</i>
        </small>
        <small>
            <i>Updated: {{ blog.updated_at|date:"F j, Y, g:i a" }}</i>
        </small>
    </div>
    <div class="blog-content">
        {{ blog.content|linebreaks }}
    </div>
    <a href="{% url 'blog-list' %}" class="back-link">← Back to Blog List</a>
</div>
{% endblock %}
